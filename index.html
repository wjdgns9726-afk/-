<title>발표 포스터 갤러리</title>
<meta name="description" content="NFC 태그를 대면 열리는 포럼 발표 포스터 안내 페이지">
<style>
  :root{
    --bg:#FAF7F2;
    --surface:#FFFFFF;
    --surface-2:#F1ECE3;
    --ink:#1E2430;
    --ink-soft:#5B6472;
    --accent:#D9642C;
    --accent-ink:#FFFFFF;
    --line:#E4DDD0;
    --shadow: 0 1px 2px rgba(30,36,48,.04), 0 8px 24px rgba(30,36,48,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171C;
      --surface:#1C2027;
      --surface-2:#242933;
      --ink:#EDEAE3;
      --ink-soft:#9AA1AC;
      --accent:#E8823F;
      --accent-ink:#14171C;
      --line:#2E333D;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171C;
    --surface:#1C2027;
    --surface-2:#242933;
    --ink:#EDEAE3;
    --ink-soft:#9AA1AC;
    --accent:#E8823F;
    --accent-ink:#14171C;
    --line:#2E333D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans KR','IBM Plex Sans',-apple-system,sans-serif;
    padding-inline:20px;
  }
  h1,h2,.display{
    font-family:'Fraunces','IBM Plex Sans KR',serif;
    font-optical-sizing:auto;
  }
  .mono{
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric: tabular-nums;
  }

  header.top{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    background:var(--bg);
    padding-block:18px 12px;
    border-bottom:1px solid var(--line);
    margin-inline:-20px;
    padding-inline:20px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
  }
  h1{
    font-size:clamp(24px,5vw,32px);
    font-weight:600;
    margin:0 0 8px;
    text-wrap:balance;
  }
  .instructions{
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
    max-width:60ch;
    margin:0;
  }

  main{
    max-width:920px;
    margin:0 auto;
    padding-block:24px 48px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:0;
    text-align:left;
    cursor:pointer;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    font:inherit;
    color:inherit;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-2px);
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .card:active{ transform:translateY(0); }

  .thumb{
    aspect-ratio:3/4;
    max-width:100%;
    display:flex;
    align-items:flex-end;
    padding:16px;
    color:#fff;
    position:relative;
  }
  .thumb .num{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:56px;
    line-height:1;
    opacity:.9;
  }
  .thumb img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .thumb .play-badge{
    position:absolute;
    inset:0;
    margin:auto;
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter: blur(2px);
  }
  .thumb .chip{
    position:absolute;
    top:12px;
    right:12px;
    background:rgba(0,0,0,.35);
    color:#fff;
    font-size:11px;
    padding:4px 8px;
    border-radius:999px;
    letter-spacing:.04em;
  }

  .card-body{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    border-top:1px solid var(--line);
  }
  .card-body .order{
    font-size:12px;
    color:var(--accent);
    letter-spacing:.08em;
  }
  .card-body .title{
    font-weight:600;
    font-size:16px;
    line-height:1.35;
  }
  .card-body .speaker{
    font-size:13px;
    color:var(--ink-soft);
  }

  /* poster overlay */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(10,10,10,.82);
    display:flex;
    flex-direction:column;
    z-index:100;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .overlay-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    color:#EDEAE3;
  }
  .overlay-top .order{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:.1em;
    color:#C9CDD4;
  }
  .icon-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#EDEAE3;
    width:38px;
    height:38px;
    border-radius:10px;
    font-size:18px;
    line-height:1;
    cursor:pointer;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.16); }

  .overlay-body{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 12px;
    min-height:0;
    position:relative;
  }
  .poster-frame{
    max-width:min(560px,94vw);
    max-height:100%;
    width:100%;
    aspect-ratio:3/4;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-align:center;
    padding:24px;
    position:relative;
  }
  .poster-frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#0000;
  }
  .placeholder-note{
    position:relative;
    z-index:1;
  }
  .placeholder-note .num{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:88px;
    line-height:1;
    opacity:.9;
    margin-bottom:8px;
  }
  .placeholder-note p{
    font-size:13px;
    opacity:.85;
    margin-top:10px;
  }

  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#EDEAE3;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
  }
  .nav-btn:hover{ background:rgba(255,255,255,.16); }
  .nav-btn:disabled{ opacity:.25; cursor:default; }
  .nav-prev{ left:8px; }
  .nav-next{ right:8px; }

  .overlay-caption{
    padding:16px 24px 24px;
    text-align:center;
    color:#EDEAE3;
  }
  .overlay-caption .title{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
    text-wrap:balance;
  }
  .overlay-caption .speaker{
    font-size:14px;
    color:#B7BCC4;
  }

  [hidden]{ display:none!important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<header class="top">
  <p class="eyebrow">NFC Poster Guide</p>
  <h1>발표 포스터 갤러리</h1>
  <p class="instructions">NFC 카드를 태깅하면 이 페이지가 열려요. 아래에서 확인하고 싶은 발표를 눌러 포스터를 보세요.</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-top">
    <span class="order mono" id="ov-order"></span>
    <button class="icon-btn" id="ov-close" aria-label="닫기">✕</button>
  </div>
  <div class="overlay-body">
    <button class="nav-btn nav-prev" id="ov-prev" aria-label="이전 발표">‹</button>
    <div class="poster-frame" id="poster-frame"></div>
    <button class="nav-btn nav-next" id="ov-next" aria-label="다음 발표">›</button>
  </div>
  <div class="overlay-caption">
    <p class="title" id="ov-title"></p>
    <p class="speaker" id="ov-speaker"></p>
  </div>
</div>

<script>
  // 발표 정보: 실제 제목/발표자가 정해지면 title/speaker만 채우면 됩니다.
  // type: "video" | "image" | "" (비워두면 자동으로 임시(준비중) 포스터가 표시됩니다)
  const TALKS = [
    { order: 1, title: "발표 1", speaker: "발표자 미정", type: "video", thumb: "videos/1_poster.jpg", src: "videos/1.mp4" },
    { order: 2, title: "발표 2", speaker: "발표자 미정", type: "video", thumb: "videos/2_poster.jpg", src: "videos/2.mp4" },
    { order: 3, title: "발표 3", speaker: "발표자 미정", type: "video", thumb: "videos/3_poster.jpg", src: "videos/3.mp4" },
    { order: 4, title: "발표 4", speaker: "발표자 미정", type: "video", thumb: "videos/4_poster.jpg", src: "videos/4.mp4" },
    { order: 5, title: "발표 5", speaker: "발표자 미정", type: "video", thumb: "videos/5_poster.jpg", src: "videos/5.mp4" },
    { order: 6, title: "발표 6", speaker: "발표자 미정", type: "video", thumb: "videos/6_poster.jpg", src: "videos/6.mp4" },
  ];

  const HUES = [18, 342, 265, 195, 40, 150]; // 카드별 그라데이션 포인트 색상

  function gradientFor(i){
    const h = HUES[i % HUES.length];
    return `linear-gradient(160deg, hsl(${h} 55% 40%), hsl(${(h+40)%360} 45% 22%))`;
  }

  const grid = document.getElementById('grid');

  TALKS.forEach((talk, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    card.setAttribute('type', 'button');
    card.addEventListener('click', () => openPoster(i));

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.background = gradientFor(i);
    if (talk.thumb) {
      const img = document.createElement('img');
      img.src = talk.thumb;
      img.alt = talk.title + ' 포스터';
      thumb.appendChild(img);
      if (talk.type === 'video') {
        const play = document.createElement('span');
        play.className = 'play-badge';
        play.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
        thumb.appendChild(play);
      }
    } else {
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(talk.order).padStart(2, '0');
      thumb.appendChild(num);
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = '포스터 준비중';
      thumb.appendChild(chip);
    }
    card.appendChild(thumb);

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `
      <span class="order mono">SESSION ${String(talk.order).padStart(2, '0')}</span>
      <span class="title">${talk.title}</span>
      <span class="speaker">${talk.speaker}</span>
    `;
    card.appendChild(body);

    grid.appendChild(card);
  });

  const overlay = document.getElementById('overlay');
  const posterFrame = document.getElementById('poster-frame');
  const ovOrder = document.getElementById('ov-order');
  const ovTitle = document.getElementById('ov-title');
  const ovSpeaker = document.getElementById('ov-speaker');
  const prevBtn = document.getElementById('ov-prev');
  const nextBtn = document.getElementById('ov-next');
  let current = 0;

  function renderPoster(i){
    const talk = TALKS[i];
    posterFrame.innerHTML = '';
    if (talk.type === 'video' && talk.src) {
      posterFrame.style.background = '#000';
      const video = document.createElement('video');
      video.src = talk.src;
      if (talk.thumb) video.poster = talk.thumb;
      video.controls = true;
      video.playsInline = true;
      video.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;';
      posterFrame.appendChild(video);
    } else if (talk.type === 'image' && talk.src) {
      posterFrame.style.background = 'transparent';
      const img = document.createElement('img');
      img.src = talk.src;
      img.alt = talk.title + ' 포스터';
      posterFrame.appendChild(img);
    } else {
      posterFrame.style.background = gradientFor(i);
      const note = document.createElement('div');
      note.className = 'placeholder-note';
      note.innerHTML = `<div class="num">${String(talk.order).padStart(2,'0')}</div><p>포스터 준비중입니다</p>`;
      posterFrame.appendChild(note);
    }
    ovOrder.textContent = `SESSION ${String(talk.order).padStart(2,'0')} / ${TALKS.length}`;
    ovTitle.textContent = talk.title;
    ovSpeaker.textContent = talk.speaker;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === TALKS.length - 1;
  }

  function stopMedia(){
    const video = posterFrame.querySelector('video');
    if (video) video.pause();
  }

  function openPoster(i){
    current = i;
    renderPoster(current);
    overlay.hidden = false;
  }
  function closePoster(){ stopMedia(); overlay.hidden = true; }
  function step(delta){
    const next = current + delta;
    if (next < 0 || next >= TALKS.length) return;
    stopMedia();
    current = next;
    renderPoster(current);
  }

  document.getElementById('ov-close').addEventListener('click', closePoster);
  prevBtn.addEventListener('click', () => step(-1));
  nextBtn.addEventListener('click', () => step(1));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closePoster(); });
  document.addEventListener('keydown', (e) => {
    if (overlay.hidden) return;
    if (e.key === 'Escape') closePoster();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
</script>
