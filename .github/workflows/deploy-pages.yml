name: Deploy hello-game to GitHub Pages

on:
  push:
    branches:
      - ccr-dad33387-zyfqol
    paths:
      - "hello-game/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/supertonic3
          key: supertonic3-model-v1
      - name: Make child-like character voices
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q supertonic==1.3.1
          node hello-game/tools/dump-lines.js > /tmp/lines.json
          python hello-game/tools/make_voices.py /tmp/lines.json hello-game/voices
          du -sh hello-game/voices
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "hello-game"
      - id: deployment
        uses: actions/deploy-pages@v4
