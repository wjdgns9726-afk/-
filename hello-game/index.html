<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>안녕 친구들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap">
<style>
/* 레이아웃: 한 화면 게임. 하늘+잔디 무대 위에 캐릭터 1명, 아래쪽에 큰 버튼 */
:root{
  --sky:#bfe6ff; --sky2:#e9f7ff; --grass:#8fd16a; --grass2:#6fbf4c;
  --ink:#3a2e2a; --paper:#fffaf2; --sun:#ffd34d; --pink:#ff8fab; --accent:#ff7a59; --mint:#5cc8a8;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hand:"Gaegu","Jua","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--display);word-break:keep-all;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
.stage-bg{position:fixed;inset:0;background:linear-gradient(var(--sky) 0%,var(--sky2) 62%,var(--grass) 62%,var(--grass2) 100%);z-index:-1}
.sun{position:fixed;top:24px;right:24px;width:80px;height:80px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 14px #ffe38a66;z-index:-1;animation:spin 20s linear infinite}
.cloud{position:fixed;height:34px;width:110px;background:#fff;border-radius:40px;z-index:-1;opacity:.9;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:50px;left:16px;top:-24px}.cloud::after{width:40px;height:40px;left:52px;top:-16px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* 홈 */
#home{align-items:center;justify-content:center;gap:28px;text-align:center}
#home h1{font-size:clamp(48px,13vw,96px);margin:0;color:#fff;text-shadow:0 4px 0 var(--accent),0 8px 0 #0002;letter-spacing:2px;text-wrap:balance}
#home .sub{font-family:var(--hand);font-size:clamp(20px,5vw,28px);margin:0}
.hello-row{display:flex;gap:8px;justify-content:center}
.hello-row svg{width:clamp(70px,20vw,120px);height:auto}
.big-btn{background:var(--accent);color:#fff;font-size:clamp(30px,8vw,44px);padding:18px 54px;border-radius:999px;box-shadow:0 8px 0 #c9502f;transition:transform .1s}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c9502f}
.corner{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);width:52px;height:52px;border-radius:50%;background:#ffffffcc;font-size:26px;display:grid;place-items:center;box-shadow:0 3px 0 #0002;z-index:5}
.corner.left{left:12px}.corner.right{right:12px}

/* 고르기 */
#pick{padding-top:calc(env(safe-area-inset-top,0px) + 76px);overflow-y:auto}
#pick h2{text-align:center;font-size:clamp(26px,7vw,40px);margin:0 0 14px;color:#fff;text-shadow:0 3px 0 #0003}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;max-width:900px;width:100%;margin:0 auto;padding-bottom:30px}
.card{background:var(--paper);border-radius:28px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 #0001,0 0 0 4px #fff inset;transition:transform .12s}
.card:active{transform:scale(.95)}
.card .art{width:100%;aspect-ratio:1/1.05;max-width:100%;display:grid;place-items:center;overflow:hidden}
.card .art svg{width:92%;height:auto}
.card .art img{width:78%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 4px var(--pink)}
.card .nm{font-size:24px}
.card .stars{font-size:15px;color:#e0a100;min-height:20px}
.card.add .plus{font-size:64px;color:var(--mint)}
.section-label{grid-column:1/-1;font-size:20px;color:#fff;text-shadow:0 2px 0 #0003;margin-top:6px}

/* 놀이 */
#play{align-items:center;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.bubble{position:absolute;top:calc(env(safe-area-inset-top,0px) + 78px);left:50%;transform:translateX(-50%);max-width:min(90vw,560px);background:#fff;border-radius:30px;padding:16px 24px;font-size:clamp(24px,6.4vw,36px);text-align:center;box-shadow:0 6px 0 #0001;line-height:1.3;text-wrap:balance;word-break:keep-all}
.bubble::after{content:"";position:absolute;bottom:-18px;left:50%;margin-left:-14px;border:14px solid transparent;border-top:18px solid #fff;border-bottom:0}
.bubble:empty{display:none}
#charWrap{position:relative;width:min(70vw,44vh,360px);margin-bottom:8px}
#charWrap.enter{animation:walkIn 1.4s ease-out both}
@keyframes walkIn{0%{transform:translateX(70vw) rotate(4deg)}20%{transform:translateX(52vw) rotate(-4deg) translateY(-10px)}40%{transform:translateX(34vw) rotate(4deg)}60%{transform:translateX(18vw) rotate(-4deg) translateY(-10px)}80%{transform:translateX(6vw) rotate(2deg)}100%{transform:none}}
@keyframes jump{50%{transform:translateY(-16%) scale(1.03)}}
.photo-friend{position:relative;display:flex;flex-direction:column;align-items:center}
.photo-friend img{width:78%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:10px solid #fff;box-shadow:0 0 0 6px var(--pink),0 10px 0 #0002;animation:bob 2s ease-in-out infinite}
.photo-friend .hand{position:absolute;right:0;top:40%;font-size:min(18vw,90px);transform-origin:70% 90%}
.talking .photo-friend img{animation:bob .35s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

.controls{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.mic{width:clamp(110px,28vw,140px);height:clamp(110px,28vw,140px);border-radius:50%;background:#fff;font-size:clamp(56px,14vw,72px);display:grid;place-items:center;box-shadow:0 8px 0 #0002;position:relative}
.mic.on{background:var(--pink);animation:pulse 1.2s ease-in-out infinite}
.mic .lvl{position:absolute;inset:-10px;border-radius:50%;border:8px solid var(--mint);opacity:0;transform:scale(1);transition:transform .08s,opacity .08s;pointer-events:none}
@keyframes pulse{50%{box-shadow:0 8px 0 #0002,0 0 0 18px #ff8fab55}}
.round{width:84px;height:84px;border-radius:50%;background:#fff;font-size:44px;display:grid;place-items:center;box-shadow:0 6px 0 #0002}
.round:active,.mic:active{transform:translateY(4px)}
.hint{font-family:var(--hand);font-size:22px;text-align:center;min-height:28px;margin:6px 0 10px;color:#2f5b20}
.parent-ok{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:10px;width:44px;height:44px;border-radius:50%;background:#ffffff88;font-size:20px;opacity:.6}

/* 축하 */
.confetti{position:fixed;top:-30px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:20}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.sticker-pop{position:fixed;left:50%;top:40%;font-size:140px;transform:translate(-50%,-50%) scale(0);animation:pop 1.6s ease-out forwards;z-index:21;pointer-events:none}
@keyframes pop{30%{transform:translate(-50%,-50%) scale(1.2)}45%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-160%) scale(.5);opacity:0}}
.burst{position:fixed;left:50%;bottom:30%;width:200vmax;height:200vmax;margin:0 0 -100vmax -100vmax;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,#fffbe0 0%,#fff3a0cc 10%,#fff0 40%),repeating-conic-gradient(from 0deg,#ffd75acc 0deg 9deg,#ffd75a00 9deg 18deg);
  opacity:0;transform:scale(.2);animation:burstIn .6s ease-out forwards,burstSpin 8s linear infinite}
.burst.out{transform:scale(1);animation:burstOut .8s ease-in forwards}
@keyframes burstIn{to{opacity:1;transform:scale(1)}}
@keyframes burstSpin{from{rotate:0deg}to{rotate:360deg}}
@keyframes burstOut{from{opacity:1}to{opacity:0}}
.flash{position:fixed;inset:0;background:#fff;z-index:22;pointer-events:none;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.85}to{opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:19;pointer-events:none}
.banner{position:fixed;left:50%;top:32%;z-index:23;pointer-events:none;white-space:nowrap;
  font-size:clamp(40px,12vw,84px);color:#fff;letter-spacing:1px;
  text-shadow:0 4px 0 var(--accent),0 8px 0 #c9502f,0 12px 18px #0004;
  transform:translate(-50%,-50%) scale(0) rotate(-12deg);animation:bannerIn 3.2s cubic-bezier(.2,1.6,.4,1) forwards}
.banner span{display:inline-block;animation:letter .6s ease-in-out infinite alternate}
@keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg)}18%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}28%,85%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}100%{transform:translate(-50%,-90%) scale(.8);opacity:0}}
@keyframes letter{to{transform:translateY(-10px)}}
#charWrap.happy{animation:happyDance 1.8s ease-in-out}
@keyframes happyDance{0%{transform:none}15%{transform:translateY(-22%) scale(1.05)}30%{transform:none}45%{transform:translateY(-18%) rotate(360deg)}60%{transform:rotate(360deg)}75%{transform:translateY(-12%) rotate(360deg)}100%{transform:rotate(360deg)}}
.after{display:flex;gap:16px;justify-content:center}
.after .big-btn{font-size:clamp(20px,6vw,28px);padding:14px 22px;white-space:nowrap}
.after .big-btn.alt{background:var(--mint);box-shadow:0 8px 0 #3a9a7f}

/* 부모 설정 */
.sheet{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:30;padding:16px}
.panel{background:var(--paper);border-radius:24px;padding:22px;width:min(100%,460px);max-height:90vh;overflow:auto;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;display:flex;flex-direction:column;gap:14px}
.panel h3{font-family:var(--display);font-size:26px;margin:0}
.panel label{display:flex;flex-direction:column;gap:6px;font-weight:600}
.panel input[type=text]{font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid #e6d9c8;background:#fff}
.panel .opt{display:flex;flex-direction:row;gap:10px;align-items:flex-start;font-weight:400}
.panel .opt input{margin-top:4px;width:20px;height:20px}
.panel small{color:#7a6a60;font-weight:400;line-height:1.45}
.panel .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.panel .btn{padding:10px 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.panel .btn.ghost{background:#efe5d8;color:var(--ink)}
.panel .warn{background:#fff1d6;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.photo-preview{width:120px;height:120px;border-radius:50%;object-fit:cover;align-self:center;border:5px solid var(--pink)}

/* SVG 캐릭터 애니메이션 */
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mouth-open,.eye-happy,.heart{display:none}
.talking .mouth-open{display:inline;animation:talk .28s steps(2) infinite}
.talking .mouth-closed{animation:talk .28s steps(2) infinite reverse}
@keyframes talk{0%{opacity:1}100%{opacity:0}}
.is-happy .eye{display:none}.is-happy .eye-happy{display:inline}
.is-happy .heart{display:inline;animation:heart 1.2s ease-out infinite}
@keyframes heart{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.arm-wave{transform-box:fill-box;transform-origin:15% 90%}
.waving .arm-wave{animation:wave .45s ease-in-out infinite alternate}
.waving .hand{animation:waveEmoji .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
@keyframes waveEmoji{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stage-bg"></div>
<div class="sun"></div>
<div class="cloud" style="top:12%"></div>
<div class="cloud" style="top:28%;animation-delay:-18s;transform:scale(.7)"></div>

<!-- 홈 -->
<section class="screen" id="home">
  <div class="hello-row" id="homeChars"></div>
  <h1>안녕 친구들</h1>
  <p class="sub">친구한테 "안녕~" 해볼까?</p>
  <button class="big-btn" id="startBtn">시작! 👋</button>
  <button class="corner right" id="settingsBtn" aria-label="부모 설정">⚙️</button>
</section>

<!-- 친구 고르기 -->
<section class="screen" id="pick" hidden>
  <button class="corner left" id="pickBack" aria-label="처음으로">🏠</button>
  <button class="corner right" id="settingsBtn2" aria-label="부모 설정">⚙️</button>
  <h2>누구한테 인사할까?</h2>
  <div class="grid" id="grid"></div>
</section>

<!-- 놀이 -->
<section class="screen" id="play" hidden>
  <button class="corner left" id="playBack" aria-label="친구 고르기로">⬅️</button>
  <div class="bubble" id="bubble"></div>
  <div id="charWrap"></div>
  <div class="hint" id="hint"></div>
  <div class="controls" id="controls">
    <button class="round" id="waveBtn" aria-label="손 흔들기">👋</button>
    <button class="mic" id="micBtn" aria-label="안녕 말하기">🎤<span class="lvl" id="lvl"></span></button>
    <button class="round" id="againBtn" aria-label="다시 듣기">🔁</button>
  </div>
  <div class="after" id="after" hidden>
    <button class="big-btn alt" id="moreBtn">한번 더 🔁</button>
    <button class="big-btn" id="nextBtn">다른 친구 ➡️</button>
  </div>
  <button class="parent-ok" id="parentOk" aria-label="부모: 인사 성공으로 처리">✓</button>
</section>

<!-- 부모 설정 -->
<div class="sheet" id="settings" hidden>
  <div class="panel">
    <h3>부모님 설정</h3>
    <label>아이 이름
      <input type="text" id="kidName" placeholder="예: 도빈" maxlength="10">
      <small>캐릭터가 "도빈아 안녕~" 하고 이름을 불러줘요.</small>
    </label>
    <div>
      <div style="font-weight:600;margin-bottom:6px">인사 인식 방법</div>
      <label class="opt"><input type="radio" name="mode" value="word" id="modeWord"> <span>"안녕"이라는 말을 알아듣기<br><small>안뇽·안농처럼 비슷한 발음도 인정해요. 크롬·사파리·삼성인터넷에서 동작해요.</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="sound" id="modeSound"> <span>목소리만 내도 성공<br><small>발음이 아직 어렵거나 인식이 잘 안 될 때 추천해요. 처음엔 이걸로 자신감을 키워주세요.</small></span></label>
    </div>
    <label class="opt"><input type="checkbox" id="tts"> <span>캐릭터 목소리 켜기<br><small>휴대폰 무음 모드를 꺼야 들려요.</small></span></label>
    <div class="warn" id="supportNote"></div>
    <div style="font-weight:600">우리 친구 사진 추가</div>
    <small>어린이집 친구나 선생님 사진을 넣으면 그 친구에게 인사하는 연습을 할 수 있어요. 사진은 이 기기에만 저장돼요.</small>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <div class="row">
      <button class="btn ghost" id="resetStars">스티커 초기화</button>
      <button class="btn" id="closeSettings">완료</button>
    </div>
  </div>
</div>

<!-- 사진 친구 추가 -->
<div class="sheet" id="addSheet" hidden>
  <div class="panel">
    <h3>사진 친구 만들기</h3>
    <img class="photo-preview" id="photoPreview" alt="">
    <label>이름
      <input type="text" id="photoName" placeholder="예: 지우, 김선생님" maxlength="10">
    </label>
    <div id="photoVoiceRow">
      <div style="font-weight:600;margin-bottom:6px">목소리</div>
      <label class="opt"><input type="radio" name="photoVoice" value="girl" id="photoVoiceGirl"> <span>여자아이</span></label>
      <label class="opt"><input type="radio" name="photoVoice" value="boy" id="photoVoiceBoy"> <span>남자아이</span></label>
    </div>
    <label class="opt"><input type="checkbox" id="photoTeacher"> <span>선생님이에요 <small>(아이에게 "안녕하세요~"를 알려줘요)</small></span></label>
    <div class="row">
      <button class="btn ghost" id="photoDelete" hidden>삭제</button>
      <button class="btn ghost" id="photoCancel">취소</button>
      <button class="btn" id="photoSave">저장</button>
    </div>
  </div>
</div>

<script src="lines.js"></script>
<script>
(() => {
"use strict";

/* ---------- 저장소 ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("hello-game:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("hello-game:"+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const settings = Object.assign({ kid:window.HelloLines.DEFAULT_KID, mode:"sound", tts:true }, store.get("settings", {}));
if(!settings.kid) settings.kid = window.HelloLines.DEFAULT_KID;
let stars = store.get("stars", {});
let photos = store.get("photos", []);

/* ---------- 대사 (lines.js) ---------- */
const { CHARS, voc, iya, subj, linesFor, voiceIdFor } = window.HelloLines;
const kidSubj = () => subj(settings.kid);

/* ---------- 캐릭터 SVG ---------- */
// 공통 얼굴 부품. 눈은 깜빡이고, 기쁘면 ^^ 눈, 말하면 입이 열림.
function face({eyeY=118, eyeDX=26, cx=100, mouthY=148, nose, cheek="#ff9eb5", eyeColor="#2b2220"}){
  const ex1 = cx-eyeDX, ex2 = cx+eyeDX;
  return `
    <ellipse class="eye" cx="${ex1}" cy="${eyeY}" rx="8" ry="10" fill="${eyeColor}"/>
    <ellipse class="eye" cx="${ex2}" cy="${eyeY}" rx="8" ry="10" fill="${eyeColor}"/>
    <circle class="eye" cx="${ex1+3}" cy="${eyeY-4}" r="3" fill="#fff"/>
    <circle class="eye" cx="${ex2+3}" cy="${eyeY-4}" r="3" fill="#fff"/>
    <path class="eye-happy" d="M${ex1-9} ${eyeY+3} Q${ex1} ${eyeY-10} ${ex1+9} ${eyeY+3}" stroke="${eyeColor}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path class="eye-happy" d="M${ex2-9} ${eyeY+3} Q${ex2} ${eyeY-10} ${ex2+9} ${eyeY+3}" stroke="${eyeColor}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="${ex1-12}" cy="${eyeY+20}" rx="11" ry="7" fill="${cheek}" opacity=".7"/>
    <ellipse cx="${ex2+12}" cy="${eyeY+20}" rx="11" ry="7" fill="${cheek}" opacity=".7"/>
    ${nose||""}
    <path class="mouth-closed" d="M${cx-11} ${mouthY} Q${cx} ${mouthY+11} ${cx+11} ${mouthY}" stroke="#5a2b22" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse class="mouth-open" cx="${cx}" cy="${mouthY+4}" rx="10" ry="9" fill="#a33a3a"/>`;
}
const hearts = `<text class="heart" x="22" y="60" font-size="30">💖</text><text class="heart" x="160" y="50" font-size="26" style="animation-delay:.4s">⭐</text>`;

function animalSVG(c){
  const f = c.fur, ins = c.inner || "#ffd9e0", b = c.belly || "#fff6ea";
  let ears = "", extraBack = "", headFill = f, faceExtra = "", nose = `<ellipse cx="100" cy="134" rx="8" ry="6" fill="#4a3330"/>`;
  switch(c.kind){
    case "rabbit":
      ears = `<ellipse cx="74" cy="40" rx="16" ry="44" fill="${f}" transform="rotate(-8 74 40)"/><ellipse cx="74" cy="44" rx="8" ry="32" fill="${ins}" transform="rotate(-8 74 44)"/>
              <ellipse cx="126" cy="40" rx="16" ry="44" fill="${f}" transform="rotate(8 126 40)"/><ellipse cx="126" cy="44" rx="8" ry="32" fill="${ins}" transform="rotate(8 126 44)"/>`;
      nose = `<ellipse cx="100" cy="134" rx="6" ry="5" fill="#ff7a99"/>`; break;
    case "bear":
      ears = `<circle cx="56" cy="70" r="22" fill="${f}"/><circle cx="56" cy="70" r="11" fill="${ins}"/><circle cx="144" cy="70" r="22" fill="${f}"/><circle cx="144" cy="70" r="11" fill="${ins}"/>`;

/* ---------- 목소리(TTS) ---------- */
let koVoice = null;
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => /ko[-_]KR/i.test(v.lang) && /female|yuna|sora|heami|google/i.test(v.name)) || vs.find(v => /^ko/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

/* 미리 만들어 둔 아이 목소리(voices/). 없거나 못 불러오면 휴대폰 기본 음성으로 말해요. */
let voiceMap = {};
const clipCache = new Map();
let clipSource = null;
fetch("voices/manifest.json").then(r => r.ok ? r.json() : {}).then(m => { voiceMap = m || {}; }).catch(() => {});
function clipUrl(text, c){ const m = c && voiceMap[voiceIdFor(c)]; return m && m[text] ? "voices/" + m[text] : null; }
function loadClip(url){
  if(!clipCache.has(url)){
    const ctx = audioCtx();
    const p = fetch(url).then(r => { if(!r.ok) throw 0; return r.arrayBuffer(); })
      .then(buf => new Promise((ok, bad) => ctx.decodeAudioData(buf, ok, bad)));
    p.catch(() => clipCache.delete(url));
    clipCache.set(url, p);
  }
  return clipCache.get(url);
}
function preloadVoices(c){
  const m = c && voiceMap[voiceIdFor(c)]; if(!m || !settings.tts) return;
  const L = linesFor(c, settings.kid);
  for(const t of [L.intro, L.ask, L.retry, L.wave, L.later, ...L.good]) if(m[t]) loadClip("voices/" + m[t]);
}
function stopClip(){ if(clipSource){ try{ clipSource.onended = null; clipSource.stop(); }catch(e){} clipSource = null; } }

function say(text, c){
  return new Promise(resolve => {
    setBubble(text);
    const wrap = document.getElementById("charWrap");
    wrap.classList.add("talking");
    let done = false;
    const finish = () => { if(done) return; done = true; wrap.classList.remove("talking"); resolve(); };
    const url = settings.tts && audioCtx() ? clipUrl(text, c) : null;
    if(url){
      stopClip(); try{ speechSynthesis.cancel(); }catch(e){}
      loadClip(url).then(buf => {
        if(done) return;
        const ctx = audioCtx(), src = ctx.createBufferSource();
        src.buffer = buf; src.connect(ctx.destination);
        src.onended = () => { if(clipSource===src) clipSource = null; setTimeout(finish, 150); };
        clipSource = src; src.start();
        setTimeout(finish, buf.duration*1000 + 1500); // onended가 안 올 때 대비
      }).catch(() => speakTTS(text, c, finish));
      return;
    }
    speakTTS(text, c, finish);
  });
}
function speakTTS(text, c, finish){
  // onend가 안 오는 브라우저 대비
  const guard = setTimeout(finish, 1200 + text.length * 170);
  if(!settings.tts || !("speechSynthesis" in window)){ clearTimeout(guard); setTimeout(finish, 900 + text.length*90); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/["~]/g, ""));
    u.lang = "ko-KR"; if(koVoice) u.voice = koVoice;
    u.rate = 0.88; u.pitch = Math.min(2, (c && c.pitch) || 1.3);
    u.onend = () => { clearTimeout(guard); setTimeout(finish, 150); };
    u.onerror = () => { clearTimeout(guard); finish(); };
    speechSynthesis.speak(u);
  }catch(e){ clearTimeout(guard); finish(); }
}
function setBubble(t){ document.getElementById("bubble").textContent = t; }

/* ---------- 효과음 ---------- */
let actx = null;
function audioCtx(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} return actx; }
function fanfare(){
  const ctx = audioCtx(); if(!ctx) return;
  const t0 = ctx.currentTime;
  // 솔-솔-솔-도~ 미-도~ 팡파레
  [[392,0,.12],[392,.14,.12],[392,.28,.12],[523.25,.42,.35],[659.25,.8,.18],[523.25,1.0,.18],[783.99,1.2,.6]].forEach(([f,d,len])=>{
    for(const [type,vol,mul] of [["square",0.07,1],["triangle",0.18,2]]){
      const o = ctx.createOscillator(), g = ctx.createGain(), t = t0+d;
      o.type = type; o.frequency.value = f*mul/ (type==="triangle"?2:1);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+len+0.15);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+len+0.2);
    }
  });
  // 짝짝짝 박수
  for(let i=0;i<10;i++) noiseHit(t0 + 1.9 + i*0.16 + Math.random()*0.03, 0.35, 1800, 0.06);
}
function noiseHit(t, vol, freq, len){
  const ctx = audioCtx(); if(!ctx) return;
  const n = Math.floor(ctx.sampleRate*len), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 3);
  const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8; g.gain.value = vol;
  src.connect(f).connect(g).connect(ctx.destination); src.start(t);
}
function chime(){
  const ctx = audioCtx(); if(!ctx) return;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i*0.12;
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+0.55);
  });
}

/* ---------- 듣기 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// 아이 발음을 넉넉하게 인정: 안녕, 안뇽, 안농, 아녕, 앙녕, 안녕하세요, 하이, hello…
const HELLO = /(안\s*[녕뇽농냥넝영녀]|아\s*[녕뇽농]|앙\s*[녕뇽]|안냐|하이|헬로|hi\b|hello|hey)/i;

let listening = null; // {stop()}
function stopListening(){ if(listening){ const l = listening; listening = null; l.stop(); } setMic(false); }

function setMic(on){
  document.getElementById("micBtn").classList.toggle("on", on);
  const lvl = document.getElementById("lvl"); lvl.style.opacity = 0;
}

function listenWord(onHit, onTimeout){
  let rec, alive = true, timer;
  const end = () => { alive = false; clearTimeout(timer); try{ rec && rec.abort(); }catch(e){} };
  const startOnce = () => {
    if(!alive) return;
    rec = new SR();
    rec.lang = "ko-KR"; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
    rec.onresult = e => {
      for(let i=e.resultIndex;i<e.results.length;i++){
        for(let j=0;j<e.results[i].length;j++){
          const t = e.results[i][j].transcript || "";
          if(HELLO.test(t)){ end(); onHit(t); return; }
        }
      }
    };
    rec.onerror = e => {
      if(e.error==="not-allowed" || e.error==="service-not-allowed"){
        end(); showHint("마이크를 쓸 수 없어요. 소리 모드로 바꿀게요."); settings.mode = "sound"; saveSettings();
        onTimeout(true);
      }
    };
    rec.onend = () => { if(alive) setTimeout(startOnce, 120); }; // 인식이 일찍 끝나면 다시 듣기
    try{ rec.start(); }catch(e){}
  };
  timer = setTimeout(() => { end(); onTimeout(false); }, 9000);
  startOnce();
  return { stop: end };
}

let micStream = null;
async function listenSound(onHit, onTimeout){
  const lvl = document.getElementById("lvl");
  let alive = true, raf, timer;
  const end = () => { alive = false; cancelAnimationFrame(raf); clearTimeout(timer); lvl.style.opacity = 0; };
  const handle = { stop: end };
  try{
    if(!micStream) micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){
    showHint("마이크 허용이 필요해요. 주소창 옆 🔒에서 마이크를 허용해주세요.");
    onTimeout(true); return handle;
  }
  if(!alive) return handle;
  const ctx = audioCtx();
  const src = ctx.createMediaStreamSource(micStream), an = ctx.createAnalyser();
  an.fftSize = 1024; src.connect(an);
  const buf = new Float32Array(an.fftSize);
  // 주변 소음 기준을 잠깐 잰 뒤, 그보다 확실히 큰 소리가 0.25초 이상 나면 성공
  let base = 0.01, samples = 0, loudMs = 0, last = performance.now();
  const tick = now => {
    if(!alive) return;
    an.getFloatTimeDomainData(buf);
    let s = 0; for(const v of buf) s += v*v; const rms = Math.sqrt(s/buf.length);
    const dt = now - last; last = now;
    if(samples < 20){ base = Math.max(base, rms); samples++; }
    else{
      const th = Math.max(0.035, base*2.5);
      lvl.style.opacity = Math.min(1, rms/th);
      lvl.style.transform = `scale(${1 + Math.min(0.35, rms*4)})`;
      loudMs = rms > th ? loudMs + dt : Math.max(0, loudMs - dt/2);
      if(loudMs > 250){ end(); try{ src.disconnect(); }catch(e){} onHit(""); return; }
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  timer = setTimeout(() => { end(); try{ src.disconnect(); }catch(e){} onTimeout(false); }, 9000);
  return handle;
}

/* ---------- 놀이 흐름 ---------- */
let current = null, round = 0, busy = false, done = false;

async function startPlay(c){
  stopListening();
  current = c; round = 0; done = false; fxRun++; endCelebrate(); stopClip();
  preloadVoices(c);
  show("play");
  $("after").hidden = true; $("controls").hidden = false; $("parentOk").hidden = false;
  setBubble(""); showHint("");
  const wrap = $("charWrap");
  wrap.className = "";
  wrap.innerHTML = charArt(c);
  void wrap.offsetWidth; wrap.classList.add("enter");
  await wait(1400);
  if(current!==c) return;
  wrap.classList.remove("enter"); wrap.classList.add("waving");
  const L = lines(c);
  busy = true;
  await say(L.intro, c);
  if(current!==c) return;
  await say(L.ask, c);
  busy = false;
  if(current!==c || done) return;
  wrap.classList.remove("waving");
  beginListen();
}

function beginListen(){
  if(done || busy) return;
  stopListening();
  const c = current;
  setMic(true);
  showHint(settings.mode==="word" && SR ? "듣고 있어요 👂 \"안녕~\"" : "듣고 있어요 👂 큰 소리로 \"안녕~\"");
  const onHit = () => { listening = null; if(current===c) success(); };
  const onTimeout = async (fatal) => {
    listening = null; setMic(false);
    if(current!==c || done) return;
    round++;
    const L = lines(c);
    if(fatal){ showHint("🎤를 누르면 다시 들어요"); return; }
    $("charWrap").classList.add("waving");
    busy = true;
    if(round < 3){
      await say(L.retry, c); busy = false;
      if(current===c && !done){ $("charWrap").classList.remove("waving"); beginListen(); }
    }else{
      await say(L.later, c); busy = false;
      if(current===c && !done){ $("charWrap").classList.remove("waving"); showHint("🎤를 누르면 다시 들어요"); }
    }
  };
  if(settings.mode==="word" && SR) listening = listenWord(onHit, onTimeout);
  else { const h = { stop(){ h.cancel = true; } }; listening = h;
         listenSound(onHit, onTimeout).then(real => { if(h.cancel) real.stop(); else if(listening===h) listening = real; }); }
}

async function success(){
  if(done) return;
  done = true; stopListening();
  const c = current, wrap = $("charWrap");
  stars[c.id] = (stars[c.id]||0) + 1; store.set("stars", stars);
  showHint("");
  $("controls").hidden = true; $("parentOk").hidden = true;
  wrap.classList.remove("waving"); wrap.classList.add("is-happy","happy","waving");
  chime(); fanfare(); confetti(); stickerPop(); celebrate();
  if(navigator.vibrate) try{ navigator.vibrate([60,40,60]); }catch(e){}
  busy = true;
  // 칭찬 말이 짧게 끝나도 이펙트는 충분히 보여주기
  await Promise.all([say(lines(c).good, c), wait(3400)]);
  busy = false;
  if(current!==c) return;
  wrap.classList.remove("happy");
  endCelebrate();
  $("after").hidden = false;
}

/* 성공 이펙트: 화면 번쩍 + 회전하는 햇살 + 불꽃놀이 + "도빈이 최고!" */
let fxRun = 0;
function celebrate(){
  const flash = document.createElement("div"); flash.className = "flash";
  document.body.appendChild(flash); setTimeout(() => flash.remove(), 600);

  document.querySelectorAll(".burst").forEach(b => b.remove());
  const burst = document.createElement("div"); burst.className = "burst";
  document.body.insertBefore(burst, document.querySelector(".sun"));

  const banner = document.createElement("div"); banner.className = "banner";
  [...`${kidSubj()} 최고!`].forEach((ch,i) => { const sp = document.createElement("span"); sp.textContent = ch===" " ? "\u00a0" : ch; sp.style.animationDelay = (i*0.08)+"s"; banner.appendChild(sp); });
  const clap = document.createElement("span"); clap.textContent = " 👏"; banner.appendChild(clap);
  document.body.appendChild(banner); setTimeout(() => banner.remove(), 3300);

  fireworks();
}
function endCelebrate(){
  document.querySelectorAll(".burst").forEach(b => { b.classList.add("out"); setTimeout(() => b.remove(), 800); });
}
function fireworks(){
  const run = ++fxRun;
  let cv = $("fx");
  if(!cv){ cv = document.createElement("canvas"); cv.id = "fx"; document.body.appendChild(cv); }
  const dpr = Math.min(2, window.devicePixelRatio||1), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const colors = ["#ff5d8f","#ffd34d","#5cc8a8","#7aa7ff","#ff7a59","#c48bff","#ffffff"];
  const parts = [];
  const boom = () => {
    const x = W*(0.15+Math.random()*0.7), y = H*(0.15+Math.random()*0.35), col = pick(colors), col2 = pick(colors);
    for(let i=0;i<46;i++){
      const a = i/46*Math.PI*2, sp = 2.5 + Math.random()*3.5;
      parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, c: i%3 ? col : col2, r: 2.5+Math.random()*2.5});
    }
    noiseHit(audioCtx() ? actx.currentTime : 0, 0.25, 500, 0.25);
  };
  const plan = [0, 350, 700, 1100, 1500, 1900, 2300];
  plan.forEach(ms => setTimeout(() => { if(run===fxRun) boom(); }, ms));
  const end = performance.now() + 4200;
  const frame = now => {
    if(run!==fxRun) return;
    g.clearRect(0,0,W,H);
    for(const p of parts){
      if(p.life<=0) continue;
      p.vy += 0.06; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.life -= 0.012;
      g.globalAlpha = Math.max(0,p.life); g.fillStyle = p.c;
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI*2); g.fill();
    }
    g.globalAlpha = 1;
    if(now < end) requestAnimationFrame(frame); else g.clearRect(0,0,W,H);
  };
  requestAnimationFrame(frame);
}

// 선생님이면 선생님 목소리를 쓰므로 아이 목소리 선택은 숨겨요.
function setPhotoVoice(v){

  $("photoVoiceRow").hidden = $("photoTeacher").checked;

$("photoTeacher").addEventListener("change", () => { $("photoVoiceRow").hidden = $("photoTeacher").checked; });
function shrink(file, size){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), cv = document.createElement("canvas");
      cv.width = cv.height = size;
      cv.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => res("");
    img.src = url;
  });
}
